# Phase 2 processing parameters for the Ombrone dataset.
# Each value is a scientific choice; all are copied into the dataset history.
# Raman, scatter and crop values were derived from outputs/phase2 diagnostics
# and confirmed by the data owner on 2026-10-29.

[inner_filter]
# Absorbance-based correction, Kothawala et al. (2013). Path lengths in cm.
# Provided by the data owner on 2026-10-29: 10 mm cuvettes (one value given, used for both).
absorbance_path_length_cm = 1.0
fluorescence_path_length_cm = 1.0

[raman]
# Lawaetz & Stedmon (2009): Ex 350 nm, Em 381-426 nm, no baseline.
ex = 350
em_range = [381, 426]
baseline = false

[scatter]
# Water Raman shift: blanks give a median of 3406 cm-1 (3300-3441).
raman_shift_cm1 = 3400
# Band widths (below, above) in nm, from the measured band edges.
rayleigh1 = [10, 10]
raman1 = [8, 8]
rayleigh2 = [12, 12]
raman2 = [10, 10]
# Zeros at em < ex - 10 nm (Thygesen et al. 2004).
zero_below_rayleigh = 10
# Removed bands stay NaN for PARAFAC.
interpolate = false

[crop]
# Excitations below 240 nm are noisy (replicate CV, blank share, negatives).
ex_min = 240

[indices]
# Confirmed by the data owner on 2026-10-29 (comparisons in outputs/indices/indices_report.md).
# Computed on the EEM after inner-filter, blank subtraction and Raman normalisation,
# before scatter removal and crop (peak B at ex 275/em 310 lies in the Raman band).
stage = "after_raman"
# Excitations off the 10 nm grid (HIX 254, peaks B/T 275, M 312): linear interpolation
# between neighbouring scans.
ex_method = "linear"
# BIX denominator: em 430 nm (Huguet et al. 2009).
bix_em_den = 430

[parafac]
# Exploratory models (Murphy et al. 2013). PROPOSED.
ranks = [2, 3, 4, 5, 6, 7]
n_init = 10
normalization = "norm"   # each sample scaled to unit Frobenius norm, scores scaled back
tol = 1e-6               # exploratory; the final model is refitted with 1e-8
max_iter = 5000
random_state = 0
exclude = []             # sample_ids left out of the model (outliers), with reasons in notes

[parafac.split_half]
n_init = 5
stratify = ["river", "campaign"]  # each quarter gets a similar mix of rivers and dates
random_state = 0
threshold = 0.95                  # Tucker congruence, Lorenzo-Seva & ten Berge (2006)

[missing]
# Samples lacking a blank or absorbance: "error", "drop" or "keep".
policy = "error"
