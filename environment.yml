name: fdom-eem
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  # MKL 2026.1 crashes in BLAS calls on this machine (0xc06d007f); use OpenBLAS
  - libblas=*=*openblas
  - pandas
  - xarray
  - scipy
  - matplotlib
  - pyside6>=6.6      # eemkit desktop application
  - pytest
  - pytest-qt
  - pyinstaller       # stand-alone build of the application
  - git
  - pip
  - pip:
      # for development next to a local clone, use instead: -e ../eemkit[dev]
      - "eemkit[gui] @ git+https://github.com/LowCostSensor/eemkit@v0.1.0"
