name: fdom-eem
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  # MKL 2026.1 crashes in BLAS calls on this machine (0xc06d007f); use OpenBLAS
  - libblas=*=*openblas
  - pandas
  - xarray
  - scipy
  - matplotlib
  - pyside6>=6.6      # eemkit desktop application
  - pytest
  - pytest-qt
  - pyinstaller       # stand-alone build of the application
  - git
  - pip
  - pip:
      # eemkit from GitHub (not yet on PyPI); to pin a release later use
      # .../archive/refs/tags/v0.1.0.zip. Next to a local clone: -e ../eemkit[dev]
      - "eemkit[gui] @ https://github.com/LowCostSensor/eemkit/archive/refs/heads/main.zip"
